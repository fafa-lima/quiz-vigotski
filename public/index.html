<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#46178f">
<title>Quiz · Vigotski</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#46178f;--purple-d:#34106e;--purple-l:#5b2aa8;
  --red:#e21b3c;--blue:#1368ce;--yellow:#d89e00;--green:#26890c;
  --ok:#66bf39;--no:#ff3355;--ink:#333;--white:#fff;
  --font:Montserrat,"Segoe UI",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:var(--font);color:var(--white)}
body{min-height:100dvh;display:flex;flex-direction:column;background:var(--purple);transition:background .35s}
body.ok{background:var(--ok)}body.no{background:var(--no)}body.na{background:#6b5b8e}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}

main{flex:1;display:flex;flex-direction:column;width:min(520px,100%);margin:0 auto;padding:18px 16px 84px;padding-top:max(18px,env(safe-area-inset-top))}
.screen{display:flex;flex-direction:column;gap:16px;flex:1;animation:in .35s ease-out}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.center{text-align:center}
h1{font-size:clamp(38px,11vw,54px);line-height:1;margin:0;font-weight:900;letter-spacing:-.02em}
h2{font-size:clamp(26px,7.5vw,34px);line-height:1.1;margin:0;font-weight:900}
.sub{font-weight:600;font-size:16px;line-height:1.45;opacity:.85;margin:0}
.eyebrow{font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.logo{display:inline-flex;align-items:center;gap:10px;font-weight:900;font-size:18px}
.logo i{width:34px;height:34px;border-radius:8px;background:#fff;color:var(--purple);display:grid;place-items:center;font-style:normal;font-weight:900;font-size:20px}

/* cartão branco / campos */
.card{background:#fff;color:var(--ink);border-radius:10px;padding:18px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.card .eyebrow{color:#6b6b6b}
input{width:100%;padding:16px;border-radius:6px;border:2px solid #cfcfcf;background:#fff;color:var(--ink);font-size:20px;font-weight:700;text-align:center;outline:0}
input:focus{border-color:var(--purple)}
input::placeholder{color:#9a9a9a;font-weight:600}
.btn{width:100%;border:0;border-radius:6px;padding:16px 20px;background:#333;color:#fff;font-weight:800;font-size:19px;box-shadow:0 4px 0 #000;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.btn:disabled{opacity:.5}
.err{color:#c4162f;font-weight:700;min-height:1.3em;font-size:14px;text-align:center}

/* topo da pergunta */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pill{background:rgba(0,0,0,.28);border-radius:99px;padding:7px 14px;font-weight:800;font-size:14px}
.tbar{height:10px;border-radius:99px;background:rgba(0,0,0,.28);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:#fff;border-radius:99px;transition:width .25s linear}
.tbar.low i{background:#ffd23f}
.sec{min-width:44px;text-align:center;font-weight:900;font-size:22px}
.q{font-size:clamp(20px,5.6vw,26px);font-weight:800;line-height:1.3;background:#fff;color:var(--ink);padding:16px 18px;border-radius:10px;box-shadow:0 4px 0 rgba(0,0,0,.2)}

/* alternativas */
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;border:0;border-radius:8px;padding:16px;min-height:76px;font-weight:800;font-size:clamp(16px,4.5vw,19px);line-height:1.25;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.28);transition:transform .08s,box-shadow .08s,opacity .2s}
.opt:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.opt svg{width:30px;height:30px;flex-shrink:0}
.opt:disabled{opacity:.55}
.c0{background:var(--red)}.c1{background:var(--blue)}.c2{background:var(--yellow)}.c3{background:var(--green)}

/* resultado */
.ico{width:112px;height:112px;margin:8px auto 0;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.ico svg{width:64px;height:64px}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.gain{display:inline-block;background:rgba(0,0,0,.3);border-radius:8px;padding:10px 26px;font-weight:900;font-size:32px;font-variant-numeric:tabular-nums}
.streak{font-weight:800;background:rgba(0,0,0,.22);border-radius:99px;padding:7px 16px;display:inline-block;font-size:14px}
.correct{color:var(--ink)}
.correct .a{display:flex;gap:12px;align-items:center;margin:8px 0 10px;font-weight:800;font-size:17px}
.correct .a span{width:38px;height:38px;border-radius:6px;display:grid;place-items:center;flex-shrink:0}
.correct .a svg{width:20px;height:20px}
.correct p{margin:0;font-weight:500;font-size:15px;line-height:1.5;color:#555}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:rgba(0,0,0,.25);border-radius:10px;padding:14px;text-align:center}
.stat b{display:block;font-size:30px;font-weight:900;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;margin:4px auto;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sentopt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:8px;font-weight:800;color:#fff;text-align:left;box-shadow:0 4px 0 rgba(0,0,0,.28)}
.sentopt svg{width:26px;height:26px;flex-shrink:0}

/* fim */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:6px 0 0}
.pc{flex:1;max-width:140px;text-align:center}
.pc .nm{font-weight:800;font-size:13px;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .b{display:grid;align-content:start;justify-items:center;padding-top:10px;border-radius:6px 6px 0 0;color:#fff;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.9,.3,1) backwards;font-weight:900}
.pc .b em{font-style:normal;font-size:26px;line-height:1}.pc .b small{font-size:12px;opacity:.9;margin-top:4px;font-weight:800}
.pc.p1 .b{height:132px;background:#c99700;animation-delay:.3s}.pc.p2 .b{height:100px;background:#8a96a3;animation-delay:.15s}.pc.p3 .b{height:78px;background:#a8643a;animation-delay:.05s}
@keyframes grow{from{transform:scaleY(0)}}
.row{display:flex;align-items:center;gap:12px;padding:11px 4px;font-weight:700;border-bottom:1px solid #eee;color:var(--ink)}
.row:last-child{border:0}.row .n{width:24px;text-align:center;color:#888;font-weight:800}.row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row b{font-variant-numeric:tabular-nums}
.row.me{background:#f1e9fb;border-radius:6px;padding-left:8px;padding-right:8px}

/* barra inferior fixa */
#foot{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px max(12px,env(safe-area-inset-bottom));background:#fff;color:var(--ink);font-weight:800;box-shadow:0 -2px 10px rgba(0,0,0,.15);z-index:5}
#foot[hidden]{display:none}
#foot .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#foot b{background:#333;color:#fff;border-radius:6px;padding:5px 14px;font-variant-numeric:tabular-nums}
.conn{position:fixed;top:0;left:0;right:0;background:#ffd23f;color:#333;text-align:center;font-weight:800;font-size:13px;padding:6px;z-index:9}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.cdn{font-size:clamp(110px,40vw,200px);font-weight:900;line-height:1;animation:cdpop .9s ease-out}
@keyframes cdpop{from{transform:scale(1.6);opacity:0}30%{opacity:1}to{transform:scale(1)}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="conn" id="conn" hidden>Sem conexão… tentando de novo</div>
<main id="app"></main>
<div id="foot" hidden><span class="nm" id="fn"></span><b id="fs">0</b></div>

<script>
const $ = s => document.querySelector(s);
const app = $('#app');
const IC = [
  '<svg viewBox="0 0 32 32"><path d="M16 4 29.5 27h-27z" fill="#fff"/></svg>',
  '<svg viewBox="0 0 32 32"><path d="M16 1.5 30.5 16 16 30.5 1.5 16z" fill="#fff"/></svg>',
  '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="#fff"/></svg>',
  '<svg viewBox="0 0 32 32"><rect x="4" y="4" width="24" height="24" rx="2" fill="#fff"/></svg>'];
const CHECK = '<svg viewBox="0 0 24 24"><path d="M4.5 12.5l5 5L19.5 7" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CROSS = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/></svg>';
const CLOCK = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#fff" stroke-width="2.6"/><path d="M12 7v5l3 2" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>';
let me = null;
try { me = JSON.parse(localStorage.getItem('vq-me') || 'null'); } catch (e) {}
let S = null, offset = 0, view = '', sending = false, notice = '', connOK = true;
let prevRank = 0, streak = 0, lastChoice = -1;

const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setView(key, html, after, cls){
  if (key === view) return;
  view = key; document.body.className = cls || '';
  app.innerHTML = `<div class="screen">${html}</div>`;
  if (after) after();
}
const vibrate = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
function countUp(el, to, ms){
  if (!el) return; const t0 = performance.now();
  (function f(t){ const k = Math.min(1, (t - t0) / ms); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(f); })(t0);
}
let wl = null;
async function keepAwake(){ try { if ('wakeLock' in navigator && !wl) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => wl = null); } } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); poll(); } });

/* confete (só no pódio / acerto) */
const fx = $('#fx'), cx = fx.getContext('2d'); let parts = [], raf = 0;
function size(){ fx.width = innerWidth * devicePixelRatio; fx.height = innerHeight * devicePixelRatio; }
addEventListener('resize', size); size();
function confetti(n){
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const cols = ['#e21b3c', '#1368ce', '#d89e00', '#26890c', '#ffffff', '#46178f'], d = devicePixelRatio;
  for (let i = 0; i < (n || 90); i++) parts.push({x:fx.width / 2 + (Math.random() - .5) * 120 * d, y:fx.height * .4, vx:(Math.random() - .5) * 15 * d, vy:(-Math.random() * 14 - 5) * d, g:.42 * d, w:(6 + Math.random() * 6) * d, h:(4 + Math.random() * 5) * d, r:Math.random() * 6, vr:(Math.random() - .5) * .35, c:cols[i % cols.length], life:1});
  if (!raf) raf = requestAnimationFrame(loop);
}
function loop(){
  cx.clearRect(0, 0, fx.width, fx.height);
  parts = parts.filter(p => p.y < fx.height + 40 && p.life > 0);
  for (const p of parts){ p.vy += p.g; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.r += p.vr; p.life -= .004; cx.save(); cx.globalAlpha = Math.max(0, p.life); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore(); }
  raf = parts.length ? requestAnimationFrame(loop) : 0;
}

async function poll(){
  try {
    const r = await fetch('/api/state?id=' + encodeURIComponent(me ? me.id : ''), {cache:'no-store'});
    const s = await r.json();
    if (s.error) throw new Error(s.error);
    offset = s.now - Date.now(); S = s; connOK = true;
    if (me && s.you === null) { notice = 'O jogo foi reiniciado. Entre de novo.'; me = null; prevRank = 0; streak = 0; try { localStorage.removeItem('vq-me'); } catch (e) {} }
    render();
  } catch (e) { connOK = false; }
  $('#conn').hidden = connOK;
}
setInterval(poll, 1800); poll();

/* ---------- entrar ---------- */
function joinHTML(){
  return `<div class="center" style="margin-top:7vh;display:grid;gap:12px;justify-items:center">
      <span class="logo"><i>V</i>Quiz</span>
      <h1>Vigotski</h1><p class="sub">Psicologia da Educação</p></div>
    <div class="card" style="display:grid;gap:12px;margin-top:10px">
      <input id="nm" maxlength="20" placeholder="Seu nome" autocomplete="off" autocapitalize="words" enterkeyhint="go">
      <div class="err" id="err">${esc(notice)}</div>
      <button class="btn" id="go">Entrar</button></div>
    <p class="sub center" style="font-size:14px">Acertar rápido vale mais pontos.</p>`;
}
async function join(){
  const name = $('#nm').value.trim();
  if (!name) { $('#err').textContent = 'Digite um nome.'; return; }
  $('#go').disabled = true;
  try {
    const r = await fetch('/api/join', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name})});
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Erro');
    me = {id:j.id, name:j.name}; notice = ''; prevRank = 0; streak = 0;
    try { localStorage.setItem('vq-me', JSON.stringify(me)); } catch (e) {}
    keepAwake(); vibrate(25); view = ''; poll();
  } catch (e) { $('#err').textContent = e.message; $('#go').disabled = false; }
}
app.addEventListener('click', e => { if (e.target.closest('#go')) join(); });
app.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'nm') join(); });

/* ---------- responder ---------- */
async function answer(c){
  if (sending || !S || !S.you || S.you.answered) return;
  sending = true; lastChoice = c; vibrate(30);
  S.you.answered = true; S.you.choice = c; view = '';
  render();
  try { await fetch('/api/answer', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:me.id, choice:c})}); } catch (e) {}
  sending = false; poll();
}
app.addEventListener('click', e => { const b = e.target.closest('.opt[data-c]'); if (b && !b.disabled) answer(+b.dataset.c); });

const remaining = () => S && S.question ? S.question.limit - (Date.now() + offset - S.t0) / 1000 : 0;

function render(){
  if (!S) return;
  keepAwake();
  const foot = $('#foot');
  if (!me) { foot.hidden = true; setView('join', joinHTML()); return; }
  const y = S.you || {score:0};
  const Q = S.question;
  foot.hidden = false; $('#fn').textContent = me.name; $('#fs').textContent = y.score || 0;

  if (S.phase === 'lobby'){
    setView('lobby', `<div class="center" style="margin-top:10vh;display:grid;gap:14px;justify-items:center">
        <span class="logo"><i>V</i>Quiz Vigotski</span>
        <h2>Você está dentro!</h2>
        <p class="sub">Veja seu nome no telão.<br>O apresentador vai iniciar em instantes.</p>
        <div class="spin"></div>
        <span class="pill" id="np"></span></div>`);
    $('#np').textContent = `${S.nPlayers} ${S.nPlayers === 1 ? 'pessoa' : 'pessoas'} na sala`;
  }
  else if (S.phase === 'question' && Date.now() + offset < S.t0){
    const n = Math.max(1, Math.ceil((S.t0 - Date.now() - offset) / 1000));
    setView('cd' + S.q, `<div class="center" style="margin-top:14vh;display:grid;gap:14px;justify-items:center">
        <div class="eyebrow">Pergunta ${Q.n} de ${S.total}</div><h2>Prepare-se!</h2><div class="cdn" id="cdn">${n}</div></div>`);
    const el = $('#cdn'); if (el && el.textContent !== String(n)) { el.textContent = n; el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; vibrate(12); }
  }
  else if (S.phase === 'question'){
    if (y.answered){
      const c = y.choice != null && y.choice >= 0 ? y.choice : lastChoice;
      setView('sent' + S.q, `<div class="center" style="margin-top:6vh;display:grid;gap:14px">
        <div class="eyebrow">Pergunta ${Q.n} de ${S.total}</div><h2>Resposta enviada</h2>
        ${c >= 0 && Q.options[c] != null ? `<div class="sentopt c${c}">${IC[c]}<span>${esc(Q.options[c])}</span></div>` : ''}
        <p class="sub">Aguardando o resultado…</p><div class="spin"></div></div>`);
    } else {
      setView('q' + S.q, `<div class="top"><span class="pill">${Q.n} de ${S.total}</span><span class="sec" id="rs">0</span></div>
        <div class="tbar" id="tm"><i></i></div>
        <div class="q">${esc(Q.text)}</div>
        <div class="opts">${Q.options.map((o, i) => `<button class="opt c${i}" data-c="${i}">${IC[i]}<span>${esc(o)}</span></button>`).join('')}</div>`);
      tickTimer();
    }
  }
  else if (S.phase === 'reveal'){
    const key = 'rv' + S.q + (y.answered ? 'a' : 'n');
    const kind = !y.answered ? 'na' : y.correct ? 'ok' : 'no';
    if (key !== view){
      if (y.correct) streak++; else streak = 0;
      const delta = prevRank && y.rank ? prevRank - y.rank : 0;
      if (y.rank) prevRank = y.rank;
      const head = {ok:'Correto!', no:'Incorreto', na:'Tempo esgotado'}[kind], icon = {ok:CHECK, no:CROSS, na:CLOCK}[kind];
      const extra = [];
      if (kind === 'ok') extra.push(`<div class="gain">+<span id="gain">0</span></div>`);
      if (streak >= 2) extra.push(`<span class="streak">${streak} acertos seguidos</span>`);
      if (delta > 0) extra.push(`<span class="streak">Subiu ${delta} ${delta === 1 ? 'posição' : 'posições'}</span>`);
      setView(key, `<div class="center" style="display:grid;gap:12px;justify-items:center"><div class="ico">${icon}</div><h2>${head}</h2>${extra.join('')}</div>
        <div class="card correct"><div class="eyebrow">Resposta certa</div>
          <div class="a"><span class="c${S.correct}">${IC[S.correct]}</span>${esc(Q.options[S.correct])}</div>
          ${S.explanation ? `<p>${esc(S.explanation)}</p>` : ''}</div>
        <div class="stats"><div class="stat"><b id="sc">0</b><span>Pontos</span></div>
          <div class="stat"><b>${y.rank || '–'}º</b><span>de ${y.of || S.nPlayers}</span></div></div>
        <p class="sub center">Aguarde a próxima pergunta</p>`,
        () => { countUp($('#gain'), y.gained || 0, 900); countUp($('#sc'), y.score || 0, 1000); if (kind === 'ok') { confetti(60); vibrate([40, 40, 90]); } else if (kind === 'no') vibrate(220); }, kind);
    }
  }
  else if (S.phase === 'end'){
    const b = S.board || [], top = [b[1], b[0], b[2]], cls = ['p2', 'p1', 'p3'], num = ['2', '1', '3'];
    const inTop3 = y.rank && y.rank <= 3;
    setView('end', `<div class="center" style="display:grid;gap:8px"><div class="eyebrow">Fim do quiz</div><h2>${inTop3 ? 'Você está no pódio!' : 'Obrigado por jogar!'}</h2>
        <p class="sub">Você ficou em <b>${y.rank || '–'}º</b> lugar</p><div class="gain" style="justify-self:center"><span id="fin">0</span> pts</div></div>
      ${b.length ? `<div class="podium">${top.map((p, i) => p ? `<div class="pc ${cls[i]}"><div class="nm">${esc(p.name)}</div><div class="b"><em>${num[i]}</em><small>${p.score}</small></div></div>` : '').join('')}</div>` : ''}
      <div class="card" style="padding:8px 14px"><div class="eyebrow" style="margin:8px 0 4px">Classificação</div>
        ${b.map((p, i) => `<div class="row ${me && p.name === me.name ? 'me' : ''}"><span class="n">${i + 1}</span><span class="nm">${esc(p.name)}</span><b>${p.score}</b></div>`).join('')}</div>`,
      () => { countUp($('#fin'), y.score || 0, 1200); if (inTop3) { confetti(130); vibrate([60, 40, 60, 40, 140]); } });
  }
}
function tickTimer(){
  if (view.startsWith('cd') && S && S.question) { render(); if (Date.now() + offset >= S.t0) vibrate(40); return; }
  const tm = $('#tm'); if (!tm || !S || !S.question) return;
  const left = Math.max(0, remaining()), pct = Math.max(0, Math.min(100, left / S.question.limit * 100));
  tm.firstElementChild.style.width = pct + '%'; tm.classList.toggle('low', left < 6);
  $('#rs').textContent = Math.ceil(left);
  if (left <= 0) document.querySelectorAll('.opt').forEach(b => b.disabled = true);
}
setInterval(tickTimer, 120);
</script>
</body>
</html>
