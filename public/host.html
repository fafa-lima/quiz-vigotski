<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070f1d">
<title>Telão · Quiz Vigotski</title>
<style>
:root{
  --bg:#070f1d;--surface:#ffffff0d;--surface2:#ffffff14;--border:#ffffff1f;
  --blue:#4f9cf9;--teal:#3ecfb2;--orange:#f9a84f;--pink:#c084fc;--gold:#ffd166;
  --text:#e8f0fe;--muted:#93aed6;--white:#fff;
  --g0:linear-gradient(135deg,#63aaff,#3b7ee8);--g1:linear-gradient(135deg,#4fe0c3,#25ab94);
  --g2:linear-gradient(135deg,#ffb95e,#f08a24);--g3:linear-gradient(135deg,#d09bff,#a05cf0);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",ui-sans-serif,system-ui,Arial,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
button,a{font:inherit;cursor:pointer;color:inherit}
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:60vmax;height:60vmax;background:#1d4ed8;left:-18vmax;top:-26vmax}
.aurora i:nth-child(2){width:50vmax;height:50vmax;background:#0f9e8a;right:-16vmax;top:22vh;animation-delay:-7s;opacity:.34}
.aurora i:nth-child(3){width:44vmax;height:44vmax;background:#7c3aed;left:26vw;bottom:-30vmax;animation-delay:-12s;opacity:.3}
@keyframes drift{to{transform:translate3d(6vmax,4vmax,0) scale(1.12)}}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px clamp(16px,3vw,40px);flex-wrap:wrap}
.brand{display:flex;gap:11px;align-items:center;font-weight:900;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--blue),var(--teal));display:grid;place-items:center;color:#fff;font-weight:950;box-shadow:0 6px 18px #4f9cf955}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:99px;padding:13px 26px;background:linear-gradient(135deg,#5aa6ff,#3b7ee8);color:#fff;font-weight:900;font-size:16px;box-shadow:0 10px 26px #3b7ee855;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.alt{background:var(--surface2);border:1px solid var(--border);box-shadow:none;font-size:13px;padding:9px 15px;font-weight:800;text-decoration:none;backdrop-filter:blur(10px)}
.btn:disabled{opacity:.4}
.pill{background:var(--surface2);border:1px solid var(--border);border-radius:99px;padding:8px 14px;font-size:13px;font-weight:800;color:var(--white)}
kbd{font:inherit;font-size:11px;font-weight:900;padding:2px 7px;border-radius:6px;background:#ffffff1f;margin-left:6px;color:var(--muted)}

main{flex:1;padding:6px clamp(18px,5vw,80px) 30px;width:min(1320px,100%);margin:0 auto;display:flex;flex-direction:column;gap:20px}
.screen{display:flex;flex-direction:column;gap:20px;flex:1;animation:in .5s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.eyebrow{font-size:12px;font-weight:950;letter-spacing:.2em;text-transform:uppercase;color:var(--teal)}
h1{font-size:clamp(44px,7.6vw,104px);line-height:.94;letter-spacing:-.06em;margin:8px 0 0;font-weight:950;color:var(--white)}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--blue),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--muted)}
.glass{background:var(--surface);border:1px solid var(--border);border-radius:26px;padding:clamp(16px,2.4vw,30px);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}

/* lobby */
.lobby{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(20px,4vw,64px);align-items:center;margin:auto 0}
.url{display:inline-block;font-size:clamp(18px,2.6vw,34px);font-weight:900;color:var(--white);word-break:break-all;margin:18px 0 10px;padding:10px 20px;border-radius:18px;background:var(--surface2);border:1px solid var(--border)}
.qrwrap{position:relative;padding:16px}
.qrwrap::before{content:"";position:absolute;inset:-6px;border-radius:38px;background:conic-gradient(from 0deg,var(--blue),var(--teal),var(--pink),var(--blue));filter:blur(14px);opacity:.55;animation:spin 8s linear infinite;z-index:-1}
@keyframes spin{to{transform:rotate(360deg)}}
.qr{background:#fff;border-radius:28px;padding:16px;display:grid;place-items:center;aspect-ratio:1}
.qr img{width:100%;display:block}
.names{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px;max-height:32vh;overflow:auto;align-content:flex-start}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:99px;padding:5px 15px 5px 5px;font-weight:800;font-size:16px;animation:popchip .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes popchip{from{opacity:0;transform:scale(.4)}}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:13px;color:#07121f;flex-shrink:0}
.count{display:flex;align-items:baseline;gap:10px;margin-top:20px;font-weight:800;color:var(--muted);font-size:18px}
.count b{font-size:clamp(40px,5vw,64px);font-weight:950;color:var(--teal);line-height:1}

/* pergunta */
.head{display:flex;justify-content:space-between;align-items:center;gap:20px}
.dots{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.dots i{width:26px;height:6px;border-radius:9px;background:#ffffff22}
.dots i.done{background:var(--teal)}.dots i.now{background:var(--white)}
.ring{position:relative;width:clamp(78px,9vw,120px);aspect-ratio:1;flex-shrink:0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring .bg{stroke:#ffffff1c}.ring .fg{stroke:var(--teal);stroke-dasharray:163.4;stroke-dashoffset:0;transition:stroke-dashoffset .25s linear,stroke .3s}
.ring.low .fg{stroke:var(--orange)}.ring.low b{color:var(--orange);animation:beat .5s ease-in-out infinite alternate}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(28px,3.6vw,48px);font-weight:950;color:var(--white)}
@keyframes beat{to{transform:scale(1.16)}}
.q{font-size:clamp(28px,4.6vw,64px);font-weight:950;line-height:1.08;letter-spacing:-.035em;color:var(--white)}
.prog{display:flex;align-items:center;gap:14px}
.prog .tr{flex:1;height:14px;border-radius:99px;background:#ffffff18;overflow:hidden}
.prog .tr i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--teal));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.prog b{font-size:clamp(20px,2.4vw,32px);font-weight:950;color:var(--white);font-variant-numeric:tabular-nums;min-width:90px;text-align:right}
.prog span{font-size:.55em;color:var(--muted);font-weight:800}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.opt{position:relative;display:flex;gap:16px;align-items:center;border-radius:26px;padding:clamp(16px,2.2vw,30px);font-weight:850;font-size:clamp(18px,2.3vw,34px);line-height:1.18;color:#07121f;overflow:hidden;box-shadow:0 14px 34px #0005,inset 0 1px 0 #ffffff55;transition:opacity .5s,transform .5s,filter .5s;animation:pop .5s cubic-bezier(.2,.9,.3,1.2) backwards}
.opt:nth-child(2){animation-delay:.06s}.opt:nth-child(3){animation-delay:.12s}.opt:nth-child(4){animation-delay:.18s}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.96)}}
.opt .sh{flex-shrink:0;width:clamp(40px,4.4vw,60px);aspect-ratio:1;border-radius:16px;background:#07121f26;display:grid;place-items:center;font-size:clamp(20px,2.4vw,32px)}
.opt .tx{position:relative;z-index:1;flex:1}
.opt .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#ffffff40;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.opt .cnt{position:relative;z-index:1;margin-left:auto;text-align:right;flex-shrink:0;font-size:clamp(22px,3vw,44px);font-weight:950;line-height:1}
.opt .cnt small{display:block;font-size:.4em;font-weight:800;opacity:.7;margin-top:4px}
.o0{background:var(--g0)}.o1{background:var(--g1)}.o2{background:var(--g2)}.o3{background:var(--g3)}
.opt.dim{opacity:.3;filter:saturate(.5);transform:scale(.985)}
.opt.right{box-shadow:0 0 0 6px #fff,0 0 60px #ffffff55;animation:win .8s cubic-bezier(.2,1.3,.4,1)}
@keyframes win{from{transform:scale(.94)}}
.tick{position:absolute;right:14px;top:-4px;font-size:clamp(28px,3vw,44px);z-index:2}

/* resultado */
.reveal{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}
.expl{font-size:clamp(17px,1.9vw,26px);line-height:1.5;color:#d4e1f7}
.brow{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:16px;position:relative;overflow:hidden;font-weight:850;font-size:clamp(16px,1.9vw,26px);background:var(--surface)}
.brow+.brow{margin-top:8px}
.brow .bg{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#3ecfb233,#4f9cf91f);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.brow>*{position:relative}
.brow .n{width:26px;text-align:center;color:var(--muted);font-weight:900}
.brow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow b{color:var(--teal);font-variant-numeric:tabular-nums}

/* fim */
.end{text-align:center;margin:auto 0;display:grid;gap:10px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,2vw,28px);margin:20px auto 6px;width:min(860px,100%)}
.pcol{flex:1;text-align:center;min-width:0}
.pcol .who{display:grid;justify-items:center;gap:8px;margin-bottom:12px;animation:in .6s both}
.pcol .who .av{width:clamp(46px,6vw,76px);height:clamp(46px,6vw,76px);font-size:clamp(20px,2.8vw,34px)}
.pcol .nm{font-weight:900;font-size:clamp(16px,2.2vw,30px);color:var(--white);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcol .bar{border-radius:22px 22px 0 0;display:grid;align-content:start;justify-items:center;padding-top:14px;transform-origin:bottom;animation:grow 1s cubic-bezier(.2,.9,.3,1) backwards;color:#07121f}
.pcol .bar .m{font-size:clamp(34px,5vw,64px);line-height:1}
.pcol .bar .sc{font-weight:950;font-size:clamp(18px,2.4vw,32px);margin-top:6px}
.pcol.p1 .bar{height:clamp(170px,26vh,280px);background:linear-gradient(180deg,#ffe08a,#e9a93a);animation-delay:.9s}
.pcol.p2 .bar{height:clamp(130px,20vh,210px);background:linear-gradient(180deg,#e6edf7,#9fb0c8);animation-delay:.5s}
.pcol.p3 .bar{height:clamp(100px,15vh,160px);background:linear-gradient(180deg,#e8b48a,#b9743d);animation-delay:.2s}
.pcol.p1 .who{animation-delay:1.5s}.pcol.p2 .who{animation-delay:1.1s}.pcol.p3 .who{animation-delay:.8s}
@keyframes grow{from{transform:scaleY(0)}}
.rest{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;width:min(860px,100%);margin:10px auto 0;text-align:left}
.rest .brow+.brow{margin-top:0}

.banner{background:#3a1f1f;border:1px solid #8a3a3a;color:#ffb4b4;padding:10px 16px;border-radius:14px;font-weight:700}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media(max-width:900px){.lobby,.reveal{grid-template-columns:1fr}.opts{grid-template-columns:1fr}.rest{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>
<canvas id="fx"></canvas>
<div class="top">
  <div class="brand"><span class="mark">V</span><span>Telão · Quiz Vigotski</span></div>
  <div class="ctl">
    <span class="pill" id="pCount">0 na sala</span>
    <button class="btn alt" id="btnFull" title="Tela cheia (F)">⛶ Tela cheia</button>
    <a class="btn alt" href="/admin.html" title="Criar e editar as perguntas">✏️ Perguntas</a>
    <button class="btn alt" id="btnReset">↺ Reiniciar</button>
    <button class="btn" id="btnMain">Iniciar</button>
  </div>
</div>
<main id="app"></main>

<script>
const $ = s => document.querySelector(s);
const SHAPES = ['▲', '●', '■', '◆'];
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let KEY = sessionStorage.getItem('vq-host-key') || '';
if (!KEY) { KEY = prompt('Chave do apresentador (HOST_KEY):') || ''; sessionStorage.setItem('vq-host-key', KEY); }
let S = null, offset = 0, view = '', busy = false, shown = [];

function hue(name){ let h = 0; for (const c of String(name)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function avatar(name){ const h = hue(name); return `<span class="av" style="background:linear-gradient(135deg,hsl(${h} 85% 70%),hsl(${(h + 40) % 360} 80% 58%))">${esc((String(name).trim()[0] || '?').toUpperCase())}</span>`; }

/* confete */
const fx = $('#fx'), cx = fx.getContext('2d'); let parts = [], raf = 0;
function size(){ fx.width = innerWidth * devicePixelRatio; fx.height = innerHeight * devicePixelRatio; }
addEventListener('resize', size); size();
function confetti(n, y){
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const cols = ['#4f9cf9', '#3ecfb2', '#f9a84f', '#c084fc', '#ffd166', '#ffffff'], d = devicePixelRatio;
  for (let i = 0; i < n; i++){ const side = i % 2 ? 1 : -1;
    parts.push({x:fx.width / 2 + side * fx.width * .42, y:fx.height * (y || .75), vx:-side * (4 + Math.random() * 10) * d, vy:(-Math.random() * 20 - 12) * d, g:.45 * d, w:(8 + Math.random() * 9) * d, h:(5 + Math.random() * 7) * d, r:Math.random() * 6, vr:(Math.random() - .5) * .35, c:cols[i % cols.length], life:1}); }
  if (!raf) raf = requestAnimationFrame(loop);
}
function loop(){
  cx.clearRect(0, 0, fx.width, fx.height);
  parts = parts.filter(p => p.y < fx.height + 40 && p.life > 0);
  for (const p of parts){ p.vy += p.g; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.r += p.vr; p.life -= .003; cx.save(); cx.globalAlpha = Math.max(0, p.life); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore(); }
  raf = parts.length ? requestAnimationFrame(loop) : 0;
}

async function poll(){
  try {
    const r = await fetch('/api/state?key=' + encodeURIComponent(KEY), {cache:'no-store'});
    const s = await r.json();
    if (s.error) throw new Error(s.error);
    offset = s.now - Date.now(); S = s; render();
  } catch (e) { $('#pCount').textContent = 'sem conexão…'; }
}
setInterval(poll, 1500); poll();

async function act(action){
  if (busy) return; busy = true;
  try {
    const r = await fetch('/api/host', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({key:KEY, action})});
    const j = await r.json();
    if (!r.ok) {
      if (r.status === 401) { sessionStorage.removeItem('vq-host-key'); KEY = prompt('Chave incorreta. Digite de novo:') || ''; sessionStorage.setItem('vq-host-key', KEY); }
      else alert(j.error || 'Erro');
    }
  } catch (e) { alert('Sem conexão com o servidor.'); }
  busy = false; view = ''; poll();
}
$('#btnReset').onclick = () => { if (confirm('Reiniciar o quiz? Todos os jogadores e pontos serão apagados.')) act('reset'); };
$('#btnFull').onclick = toggleFull;
function toggleFull(){ if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {}); }
function mainAction(){
  if (!S) return;
  if (S.phase === 'lobby') act('start');
  else if (S.phase === 'question') act('reveal');
  else if (S.phase === 'reveal') act('next');
  else if (S.phase === 'end') { if (confirm('Reiniciar o quiz?')) act('reset'); }
}
$('#btnMain').onclick = mainAction;
document.addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') { toggleFull(); return; }
  if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'Enter') { if (e.target.tagName === 'BUTTON' || e.target.tagName === 'A') return; e.preventDefault(); mainAction(); }
});

function setView(key, html, after){
  if (key === view) return;
  view = key; $('#app').innerHTML = `<div class="screen">${html}</div>`;
  if (after) after();
}
const remaining = () => S && S.question ? S.question.limit - (Date.now() + offset - S.t0) / 1000 : 0;
const dotsHTML = (n, total) => `<div class="dots">${Array.from({length:total}, (_, i) => `<i class="${i + 1 < n ? 'done' : i + 1 === n ? 'now' : ''}"></i>`).join('')}</div>`;
const boardRows = (arr, max, start) => arr.map((b, i) => `<div class="brow"><span class="bg" data-w="${max ? Math.round(b.score / max * 100) : 0}"></span><span class="n">${start + i + 1}</span>${avatar(b.name)}<span class="nm">${esc(b.name)}</span><b>${b.score}</b></div>`).join('');
const growBars = () => requestAnimationFrame(() => setTimeout(() => document.querySelectorAll('[data-w]').forEach(el => el.style.width = el.dataset.w + '%'), 60));

function render(){
  if (!S) return;
  $('#pCount').textContent = `👥 ${S.nPlayers} ${S.nPlayers === 1 ? 'pessoa' : 'pessoas'} na sala`;
  const labels = {lobby:'Iniciar quiz', question:'Mostrar resposta', reveal: S.q + 1 >= S.total ? 'Ver resultado final' : 'Próxima pergunta', end:'Reiniciar quiz'};
  $('#btnMain').innerHTML = labels[S.phase] + ' →<kbd>espaço</kbd>';
  const warn = S.host ? '' : '<div class="banner">Chave do apresentador incorreta ou HOST_KEY não definida: os botões não vão funcionar.</div>';
  const Q = S.question;

  if (S.phase === 'lobby'){
    const url = location.origin + '/';
    setView('lobby' + S.host, `${warn}<div class="lobby"><div>
        <div class="eyebrow">Quiz ao vivo · Psicologia da Educação</div>
        <h1>Entre no quiz <em>Vigotski.</em></h1>
        <div class="url">${esc(url.replace(/^https?:\/\//, ''))}</div>
        <p class="muted" style="margin:0;font-size:clamp(16px,1.6vw,22px)">Aponte a câmera para o QR code e digite seu nome. · ${S.total} ${S.total === 1 ? 'pergunta' : 'perguntas'}</p>
        <div class="count"><b id="nn">0</b><span>na sala</span></div>
        <div class="names" id="names"></div></div>
      <div class="qrwrap"><div class="qr"><img alt="QR code" src="https://api.qrserver.com/v1/create-qr-code/?size=480x480&margin=0&data=${encodeURIComponent(url)}"></div></div></div>`, () => { shown = []; });
    /* só acrescenta quem chegou agora (os chips antigos não piscam de novo) */
    const names = S.names || [], box = $('#names');
    if (shown.some(n => !names.includes(n))) { box.innerHTML = ''; shown = []; }
    names.filter(n => !shown.includes(n)).forEach(n => { box.insertAdjacentHTML('beforeend', `<span class="chip">${avatar(n)}${esc(n)}</span>`); shown.push(n); });
    $('#nn').textContent = S.nPlayers;
  }
  else if (S.phase === 'question'){
    setView('q' + S.q, `${warn}<div class="head"><div><div class="eyebrow">Pergunta ${Q.n} de ${S.total}</div>${dotsHTML(Q.n, S.total)}</div>
        <div class="ring" id="rg"><svg viewBox="0 0 60 60"><circle class="bg" cx="30" cy="30" r="26"/><circle class="fg" cx="30" cy="30" r="26"/></svg><b id="rs">0</b></div></div>
      <div class="q">${esc(Q.text)}</div>
      <div class="opts">${Q.options.map((o, i) => `<div class="opt o${i}"><span class="sh">${SHAPES[i]}</span><span class="tx">${esc(o)}</span></div>`).join('')}</div>
      <div class="prog"><div class="tr"><i id="pb"></i></div><b id="ans">0<span> / ${S.nPlayers}</span></b></div>`);
    const a = S.answered ?? 0, n = Math.max(S.nPlayers, 1);
    $('#ans').innerHTML = `${a}<span> / ${S.nPlayers}</span>`; $('#pb').style.width = Math.min(100, a / n * 100) + '%';
    tick();
  }
  else if (S.phase === 'reveal'){
    const tot = Math.max(1, S.dist.reduce((a, b) => a + b, 0));
    const board = (S.board || []).slice(0, 5), max = board.length ? board[0].score : 0;
    setView('rv' + S.q, `${warn}<div class="eyebrow">Pergunta ${Q.n} de ${S.total} · resposta</div>
      <div class="q" style="font-size:clamp(22px,3.2vw,44px)">${esc(Q.text)}</div>
      <div class="opts">${Q.options.map((o, i) => `<div class="opt o${i} ${i === S.correct ? 'right' : 'dim'}">${i === S.correct ? '<span class="tick">✅</span>' : ''}<span class="fill" data-w="${Math.round(S.dist[i] / tot * 100)}"></span><span class="sh">${SHAPES[i]}</span><span class="tx">${esc(o)}</span><span class="cnt">${S.dist[i]}<small>${Math.round(S.dist[i] / tot * 100)}%</small></span></div>`).join('')}</div>
      <div class="reveal">
        <div class="glass"><div class="eyebrow" style="margin-bottom:10px">Por quê?</div><div class="expl">${S.explanation ? esc(S.explanation) : '<span class="muted">Sem explicação cadastrada para esta pergunta.</span>'}</div></div>
        <div class="glass"><div class="eyebrow" style="margin-bottom:12px">Placar</div>${boardRows(board, max, 0) || '<span class="muted">Ninguém pontuou ainda.</span>'}</div></div>`, () => { growBars(); if (S.dist[S.correct] > 0) confetti(24, .55); });
  }
  else {
    const b = S.board || [], order = [b[1], b[0], b[2]], cls = ['p2', 'p1', 'p3'], medal = ['🥈', '🥇', '🥉'];
    setView('end', `${warn}<div class="end"><div class="eyebrow">Fim do quiz</div><h1 style="margin:6px 0 0;font-size:clamp(40px,6vw,84px)">Resultado <em>final</em></h1>
      <div class="podium">${order.map((p, i) => p ? `<div class="pcol ${cls[i]}"><div class="who">${avatar(p.name)}<div class="nm">${esc(p.name)}</div></div><div class="bar"><span class="m">${medal[i]}</span><span class="sc">${p.score}</span></div></div>` : '<div class="pcol"></div>').join('')}</div>
      ${b.length > 3 ? `<div class="rest">${boardRows(b.slice(3), b[0].score, 3)}</div>` : ''}</div>`, () => { growBars(); setTimeout(() => confetti(140), 1300); setTimeout(() => confetti(90), 2400); });
  }
}
function tick(){
  const rg = $('#rg'); if (!rg || !S || !S.question) return;
  const left = Math.max(0, remaining()), pct = Math.max(0, Math.min(1, left / S.question.limit));
  rg.querySelector('.fg').style.strokeDashoffset = 163.4 * (1 - pct);
  rg.querySelector('#rs').textContent = Math.ceil(left);
  rg.classList.toggle('low', left < 6);
}
setInterval(tick, 250);
</script>
</body>
</html>
