<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#46178f">
<title>Telão · Quiz Vigotski</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#46178f;--purple-d:#34106e;--purple-l:#5b2aa8;--bgl:#f2f2f2;
  --red:#e21b3c;--blue:#1368ce;--yellow:#d89e00;--green:#26890c;--ink:#333;
  --font:Montserrat,"Segoe UI",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:var(--font);color:#fff}
body{min-height:100vh;display:flex;flex-direction:column;background:var(--purple);transition:background .35s}
body.light{background:var(--bgl);color:var(--ink)}
button,a{font:inherit;cursor:pointer;color:inherit}

/* barra superior */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px clamp(14px,2.4vw,32px);background:#fff;color:var(--ink);box-shadow:0 1px 6px rgba(0,0,0,.18);position:relative;z-index:3;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px;color:var(--purple)}
.logo i{width:32px;height:32px;border-radius:7px;background:var(--purple);color:#fff;display:grid;place-items:center;font-style:normal;font-size:19px}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:6px;padding:11px 22px;background:#333;color:#fff;font-weight:800;font-size:15px;box-shadow:0 3px 0 #000;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.btn.main{background:var(--purple);box-shadow:0 3px 0 var(--purple-d);padding:12px 26px;font-size:16px}
.btn.main:active{box-shadow:0 1px 0 var(--purple-d)}
.btn.alt{background:#fff;color:var(--ink);border:2px solid #d6d6d6;box-shadow:none;padding:9px 14px;font-size:13px;text-decoration:none;display:inline-flex;align-items:center}
.btn.alt:active{transform:none;background:#f4f4f4}
.pill{background:#efe7fa;color:var(--purple);border-radius:99px;padding:8px 14px;font-size:13px;font-weight:800}
kbd{font:inherit;font-size:11px;font-weight:800;padding:2px 7px;border-radius:4px;background:rgba(255,255,255,.22);margin-left:8px}

main{flex:1;padding:clamp(14px,2.4vw,30px) clamp(16px,4vw,64px) 30px;width:min(1360px,100%);margin:0 auto;display:flex;flex-direction:column}
.screen{display:flex;flex-direction:column;gap:clamp(14px,2vh,24px);flex:1;animation:in .4s ease-out}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
h1{font-size:clamp(40px,6.4vw,92px);line-height:1;margin:0;font-weight:900;letter-spacing:-.02em}
.sub{font-weight:600;font-size:clamp(16px,1.7vw,24px);opacity:.9;margin:0}
.banner{background:#fff3cd;color:#664d03;padding:10px 16px;border-radius:8px;font-weight:700}

/* SALA DE ESPERA (roxo) */
.lobby{display:grid;grid-template-columns:1fr auto;gap:clamp(20px,3vw,48px);align-items:center}
.join{background:#fff;color:var(--ink);border-radius:12px;padding:clamp(16px,2vw,28px);display:flex;gap:clamp(16px,2.4vw,32px);align-items:center;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.join .steps{flex:1}
.join .lab{font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#777}
.join .url{font-weight:900;font-size:clamp(22px,3.2vw,46px);color:var(--purple);word-break:break-all;line-height:1.15;margin:6px 0 10px}
.join p{margin:0;font-weight:600;font-size:clamp(14px,1.3vw,18px);color:#555}
.join img{width:clamp(130px,16vw,230px);height:auto;display:block}
.count{display:flex;align-items:center;gap:14px;margin-top:6px}
.count b{background:rgba(0,0,0,.28);border-radius:8px;padding:6px 18px;font-size:clamp(26px,3vw,40px);font-weight:900;font-variant-numeric:tabular-nums}
.count span{font-weight:800;font-size:clamp(16px,1.6vw,22px)}
.names{display:flex;gap:10px 12px;flex-wrap:wrap;align-content:flex-start;max-height:38vh;overflow:auto}
.chip{background:rgba(255,255,255,.14);border-radius:8px;padding:9px 18px;font-weight:800;font-size:clamp(16px,1.6vw,22px);animation:popchip .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes popchip{from{opacity:0;transform:scale(.5)}}

/* PERGUNTA (claro) */
.qhead{display:grid;grid-template-columns:auto 1fr auto;gap:clamp(12px,2vw,28px);align-items:center}
.timer{width:clamp(64px,7vw,104px);aspect-ratio:1;border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center;font-weight:900;font-size:clamp(28px,3.4vw,48px);font-variant-numeric:tabular-nums;transition:background .3s}
.timer.low{background:var(--red);animation:beat .5s ease-in-out infinite alternate}
@keyframes beat{to{transform:scale(1.1)}}
.q{background:#fff;color:var(--ink);border-radius:10px;padding:clamp(16px,2.4vw,34px);font-weight:900;font-size:clamp(24px,3.6vw,54px);line-height:1.15;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.answered{text-align:center;min-width:clamp(76px,8vw,120px)}
.answered b{display:block;font-size:clamp(30px,3.6vw,52px);font-weight:900;color:var(--purple);line-height:1;font-variant-numeric:tabular-nums}
.answered span{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#777}
.qmeta{display:flex;align-items:center;justify-content:space-between;color:#666;font-weight:800;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.prog{height:8px;border-radius:99px;background:#dcdcdc;overflow:hidden;flex:1;margin-left:16px}
.prog i{display:block;height:100%;width:0;background:var(--purple);transition:width .4s}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.4vw,18px);margin-top:auto}
.opt{display:flex;gap:clamp(12px,1.6vw,22px);align-items:center;border-radius:8px;padding:clamp(16px,2.4vw,34px);min-height:clamp(84px,15vh,150px);font-weight:800;font-size:clamp(20px,2.6vw,40px);line-height:1.15;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25);animation:pop .4s cubic-bezier(.2,.9,.3,1.1) backwards}
.opt:nth-child(2){animation-delay:.05s}.opt:nth-child(3){animation-delay:.1s}.opt:nth-child(4){animation-delay:.15s}
@keyframes pop{from{opacity:0;transform:translateY(14px)}}
.opt svg{width:clamp(30px,3.6vw,54px);height:clamp(30px,3.6vw,54px);flex-shrink:0}
.c0{background:var(--red)}.c1{background:var(--blue)}.c2{background:var(--yellow)}.c3{background:var(--green)}

/* RESULTADO (claro) */
.rv{display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(14px,2vw,28px);flex:1;min-height:0}
.chart{background:#fff;border-radius:10px;padding:clamp(14px,2vw,28px);display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,1.4vw,20px);align-items:end;box-shadow:0 4px 0 rgba(0,0,0,.12);min-height:30vh}
.col{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end;gap:8px;min-width:0}
.col .num{text-align:center;font-weight:900;font-size:clamp(22px,2.6vw,38px);color:var(--ink)}
.col .pct{text-align:center;font-weight:700;font-size:13px;color:#777;margin-top:-6px}
.col .bar{position:relative;border-radius:6px 6px 0 0;height:8px;min-height:8px;transition:height 1s cubic-bezier(.2,.8,.2,1);display:grid;place-items:start center;padding-top:8px}
.col .bar.dim{opacity:.35}
.col .bar svg{width:clamp(22px,2.4vw,34px);height:clamp(22px,2.4vw,34px)}
.col .shp{display:grid;place-items:center;border-radius:6px;height:clamp(34px,4vw,52px)}
.col .shp svg{width:clamp(20px,2.2vw,30px);height:clamp(20px,2.2vw,30px)}
.col .txt{font-weight:700;font-size:clamp(11px,1.1vw,15px);color:#555;text-align:center;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.col.right .txt{color:var(--ink);font-weight:800}
.side{display:flex;flex-direction:column;gap:clamp(12px,1.6vw,20px)}
.card{background:#fff;border-radius:10px;padding:clamp(16px,2vw,26px);box-shadow:0 4px 0 rgba(0,0,0,.12)}
.card .lab{font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#777;margin-bottom:8px}
.correct{display:flex;gap:14px;align-items:center;font-weight:900;font-size:clamp(18px,2vw,28px);line-height:1.2;margin-bottom:10px}
.correct span{width:clamp(38px,3.6vw,52px);height:clamp(38px,3.6vw,52px);border-radius:6px;display:grid;place-items:center;flex-shrink:0}
.correct svg{width:55%;height:55%}
.expl{font-weight:500;font-size:clamp(15px,1.5vw,21px);line-height:1.5;color:#555;margin:0}
.brow{display:flex;align-items:center;gap:12px;padding:9px 0;font-weight:800;font-size:clamp(15px,1.6vw,22px);border-bottom:1px solid #eee;position:relative}
.brow:last-child{border:0}
.brow .n{width:28px;height:28px;border-radius:50%;background:#efe7fa;color:var(--purple);display:grid;place-items:center;font-size:14px;flex-shrink:0}
.brow:first-child .n{background:var(--purple);color:#fff}
.brow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow b{font-variant-numeric:tabular-nums;color:var(--purple)}

/* FIM (roxo) */
.end{text-align:center;display:grid;gap:12px;margin:auto 0;justify-items:center}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,1.6vw,24px);margin:16px auto 0;width:min(900px,100%)}
.pcol{flex:1;text-align:center;min-width:0}
.pcol .nm{font-weight:900;font-size:clamp(18px,2.4vw,34px);margin-bottom:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;animation:in .6s both}
.pcol .bar{border-radius:8px 8px 0 0;display:grid;align-content:start;justify-items:center;padding-top:14px;transform-origin:bottom;animation:grow 1s cubic-bezier(.2,.9,.3,1) backwards;color:#fff}
.pcol .bar em{font-style:normal;font-weight:900;font-size:clamp(34px,5vw,70px);line-height:1}
.pcol .bar small{font-weight:800;font-size:clamp(16px,2vw,28px);margin-top:6px;opacity:.95}
.pcol.p1 .bar{height:clamp(190px,30vh,320px);background:#c99700;animation-delay:.9s}
.pcol.p2 .bar{height:clamp(140px,22vh,240px);background:#8a96a3;animation-delay:.5s}
.pcol.p3 .bar{height:clamp(110px,16vh,180px);background:#a8643a;animation-delay:.2s}
.pcol.p1 .nm{animation-delay:1.5s}.pcol.p2 .nm{animation-delay:1.1s}.pcol.p3 .nm{animation-delay:.8s}
@keyframes grow{from{transform:scaleY(0)}}
.rest{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;width:min(900px,100%);margin:14px auto 0;background:#fff;color:var(--ink);border-radius:10px;padding:8px 20px;text-align:left}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media(max-width:900px){.lobby,.rv{grid-template-columns:1fr}.opts{grid-template-columns:1fr}.rest{grid-template-columns:1fr}.qhead{grid-template-columns:auto 1fr}.answered{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="top">
  <div class="logo"><i>V</i><span>Quiz Vigotski</span></div>
  <div class="ctl">
    <span class="pill" id="pCount">0 na sala</span>
    <button class="btn alt" id="btnFull" title="Tela cheia (F)">Tela cheia</button>
    <a class="btn alt" href="/admin.html">Editar perguntas</a>
    <button class="btn alt" id="btnReset">Reiniciar</button>
    <button class="btn main" id="btnMain">Iniciar</button>
  </div>
</div>
<main id="app"></main>

<script>
const $ = s => document.querySelector(s);
const IC = [
  '<svg viewBox="0 0 32 32"><path d="M16 4 29.5 27h-27z" fill="#fff"/></svg>',
  '<svg viewBox="0 0 32 32"><path d="M16 1.5 30.5 16 16 30.5 1.5 16z" fill="#fff"/></svg>',
  '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="#fff"/></svg>',
  '<svg viewBox="0 0 32 32"><rect x="4" y="4" width="24" height="24" rx="2" fill="#fff"/></svg>'];
const CHECK = '<svg viewBox="0 0 24 24"><path d="M4.5 12.5l5 5L19.5 7" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let KEY = sessionStorage.getItem('vq-host-key') || '';
if (!KEY) { KEY = prompt('Chave do apresentador (HOST_KEY):') || ''; sessionStorage.setItem('vq-host-key', KEY); }
let S = null, offset = 0, view = '', busy = false, shown = [];

/* confete */
const fx = $('#fx'), cx = fx.getContext('2d'); let parts = [], raf = 0;
function size(){ fx.width = innerWidth * devicePixelRatio; fx.height = innerHeight * devicePixelRatio; }
addEventListener('resize', size); size();
function confetti(n){
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const cols = ['#e21b3c', '#1368ce', '#d89e00', '#26890c', '#ffffff'], d = devicePixelRatio;
  for (let i = 0; i < n; i++){ const side = i % 2 ? 1 : -1;
    parts.push({x:fx.width / 2 + side * fx.width * .42, y:fx.height * .8, vx:-side * (4 + Math.random() * 10) * d, vy:(-Math.random() * 20 - 12) * d, g:.45 * d, w:(8 + Math.random() * 8) * d, h:(5 + Math.random() * 6) * d, r:Math.random() * 6, vr:(Math.random() - .5) * .35, c:cols[i % cols.length], life:1}); }
  if (!raf) raf = requestAnimationFrame(loop);
}
function loop(){
  cx.clearRect(0, 0, fx.width, fx.height);
  parts = parts.filter(p => p.y < fx.height + 40 && p.life > 0);
  for (const p of parts){ p.vy += p.g; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.r += p.vr; p.life -= .003; cx.save(); cx.globalAlpha = Math.max(0, p.life); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore(); }
  raf = parts.length ? requestAnimationFrame(loop) : 0;
}

async function poll(){
  try {
    const r = await fetch('/api/state?key=' + encodeURIComponent(KEY), {cache:'no-store'});
    const s = await r.json();
    if (s.error) throw new Error(s.error);
    offset = s.now - Date.now(); S = s; render();
  } catch (e) { $('#pCount').textContent = 'sem conexão…'; }
}
setInterval(poll, 1500); poll();

async function act(action){
  if (busy) return; busy = true;
  try {
    const r = await fetch('/api/host', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({key:KEY, action})});
    const j = await r.json();
    if (!r.ok) {
      if (r.status === 401) { sessionStorage.removeItem('vq-host-key'); KEY = prompt('Chave incorreta. Digite de novo:') || ''; sessionStorage.setItem('vq-host-key', KEY); }
      else alert(j.error || 'Erro');
    }
  } catch (e) { alert('Sem conexão com o servidor.'); }
  busy = false; view = ''; poll();
}
$('#btnReset').onclick = () => { if (confirm('Reiniciar o quiz? Todos os jogadores e pontos serão apagados.')) act('reset'); };
$('#btnFull').onclick = toggleFull;
function toggleFull(){ if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {}); }
function mainAction(){
  if (!S) return;
  if (S.phase === 'lobby') act('start');
  else if (S.phase === 'question') act('reveal');
  else if (S.phase === 'reveal') act('next');
  else if (S.phase === 'end') { if (confirm('Reiniciar o quiz?')) act('reset'); }
}
$('#btnMain').onclick = mainAction;
document.addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') { toggleFull(); return; }
  if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'Enter') { if (e.target.tagName === 'BUTTON' || e.target.tagName === 'A') return; e.preventDefault(); mainAction(); }
});

function setView(key, html, after, light){
  if (key === view) return;
  view = key; document.body.classList.toggle('light', !!light);
  $('#app').innerHTML = `<div class="screen">${html}</div>`;
  if (after) after();
}
const remaining = () => S && S.question ? S.question.limit - (Date.now() + offset - S.t0) / 1000 : 0;
const boardRows = arr => arr.map((b, i) => `<div class="brow"><span class="n">${i + 1}</span><span class="nm">${esc(b.name)}</span><b>${b.score}</b></div>`).join('');
const growBars = () => requestAnimationFrame(() => setTimeout(() => document.querySelectorAll('[data-h]').forEach(el => el.style.height = el.dataset.h), 80));

function render(){
  if (!S) return;
  $('#pCount').textContent = `${S.nPlayers} ${S.nPlayers === 1 ? 'pessoa' : 'pessoas'} na sala`;
  const labels = {lobby:'Iniciar', question:'Mostrar resposta', reveal: S.q + 1 >= S.total ? 'Ver resultado final' : 'Próxima', end:'Novo jogo'};
  $('#btnMain').innerHTML = labels[S.phase] + '<kbd>espaço</kbd>';
  const warn = S.host ? '' : '<div class="banner">Chave do apresentador incorreta ou HOST_KEY não definida: os botões não vão funcionar.</div>';
  const Q = S.question;

  if (S.phase === 'lobby'){
    const url = location.origin + '/';
    setView('lobby' + S.host, `${warn}
      <div><h1>Quiz Vigotski</h1><p class="sub" style="margin-top:10px">Psicologia da Educação · ${S.total} ${S.total === 1 ? 'pergunta' : 'perguntas'}</p></div>
      <div class="lobby">
        <div class="join"><div class="steps"><div class="lab">Entre pelo celular</div>
          <div class="url">${esc(url.replace(/^https?:\/\//, '').replace(/\/$/, ''))}</div>
          <p>Abra o endereço ou aponte a câmera para o QR code e digite seu nome.</p></div>
          <img alt="QR code" src="https://api.qrserver.com/v1/create-qr-code/?size=420x420&margin=0&data=${encodeURIComponent(url)}"></div>
        <div class="count"><b id="nn">0</b><span>na sala</span></div></div>
      <div class="names" id="names"></div>`, () => { shown = []; }, false);
    const names = S.names || [], box = $('#names');
    if (shown.some(n => !names.includes(n))) { box.innerHTML = ''; shown = []; }
    names.filter(n => !shown.includes(n)).forEach(n => { box.insertAdjacentHTML('beforeend', `<span class="chip">${esc(n)}</span>`); shown.push(n); });
    $('#nn').textContent = S.nPlayers;
  }
  else if (S.phase === 'question'){
    setView('q' + S.q, `${warn}
      <div class="qmeta"><span>Pergunta ${Q.n} de ${S.total}</span><div class="prog"><i style="width:${Q.n / S.total * 100}%"></i></div></div>
      <div class="qhead"><div class="timer" id="rs">0</div><div class="q">${esc(Q.text)}</div>
        <div class="answered"><b id="ans">0</b><span>respostas</span></div></div>
      <div class="opts">${Q.options.map((o, i) => `<div class="opt c${i}">${IC[i]}<span>${esc(o)}</span></div>`).join('')}</div>`, null, true);
    $('#ans').textContent = S.answered ?? 0;
    tick();
  }
  else if (S.phase === 'reveal'){
    const max = Math.max(1, ...S.dist), tot = Math.max(1, S.dist.reduce((a, b) => a + b, 0));
    const board = (S.board || []).slice(0, 5);
    setView('rv' + S.q, `${warn}
      <div class="qmeta"><span>Pergunta ${Q.n} de ${S.total} · resultado</span><div class="prog"><i style="width:${Q.n / S.total * 100}%"></i></div></div>
      <div class="q" style="font-size:clamp(18px,2.1vw,30px);padding:clamp(10px,1.4vw,18px)">${esc(Q.text)}</div>
      <div class="rv">
        <div class="chart">${Q.options.map((o, i) => `<div class="col ${i === S.correct ? 'right' : ''}">
            <div class="num">${S.dist[i]}</div><div class="pct">${Math.round(S.dist[i] / tot * 100)}%</div>
            <div class="bar c${i} ${i === S.correct ? '' : 'dim'}" data-h="${S.dist[i] ? (S.dist[i] / max * 20).toFixed(1) + 'vh' : '8px'}">${i === S.correct ? CHECK : ''}</div>
            <div class="shp c${i}">${IC[i]}</div><div class="txt">${esc(o)}</div></div>`).join('')}</div>
        <div class="side">
          <div class="card"><div class="lab">Resposta certa</div><div class="correct"><span class="c${S.correct}">${IC[S.correct]}</span>${esc(Q.options[S.correct])}</div>
            ${S.explanation ? `<p class="expl">${esc(S.explanation)}</p>` : ''}</div>
          <div class="card"><div class="lab">Placar</div>${boardRows(board) || '<span style="color:#777;font-weight:600">Ninguém pontuou ainda.</span>'}</div></div></div>`,
      () => { growBars(); if (S.dist[S.correct] > 0) confetti(20); }, true);
  }
  else {
    const b = S.board || [], order = [b[1], b[0], b[2]], cls = ['p2', 'p1', 'p3'], num = ['2', '1', '3'];
    setView('end', `${warn}<div class="end"><div class="sub" style="font-weight:800;letter-spacing:.1em;text-transform:uppercase">Fim do quiz</div><h1>Resultado final</h1>
      <div class="podium">${order.map((p, i) => p ? `<div class="pcol ${cls[i]}"><div class="nm">${esc(p.name)}</div><div class="bar"><em>${num[i]}</em><small>${p.score}</small></div></div>` : '<div class="pcol"></div>').join('')}</div>
      ${b.length > 3 ? `<div class="rest">${b.slice(3).map((p, i) => `<div class="brow"><span class="n">${i + 4}</span><span class="nm">${esc(p.name)}</span><b>${p.score}</b></div>`).join('')}</div>` : ''}</div>`,
      () => { setTimeout(() => confetti(140), 1300); setTimeout(() => confetti(90), 2500); }, false);
  }
}
function tick(){
  const el = $('#rs'); if (!el || !S || !S.question) return;
  const left = Math.max(0, remaining());
  el.textContent = Math.ceil(left); el.classList.toggle('low', left < 6);
}
setInterval(tick, 250);
</script>
</body>
</html>
